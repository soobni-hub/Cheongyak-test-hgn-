<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>부동산 밸런스 게임</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root{
    --purple:#ff6e0c; --purple-d:#e25a00; --ink:#1f1e30; --cream:#faf5ea;
    --coral:#ef4747; --yellow:#ffd24a; --muted:#8a879c; --line:#ece8dc;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;
    background:var(--cream);color:var(--ink);line-height:1.5;min-height:100vh;display:flex;justify-content:center}
  .app{width:100%;max-width:460px;min-height:100vh;padding:26px 20px 40px;display:flex;flex-direction:column}
  .screen{display:none;flex:1;flex-direction:column}
  .screen.on{display:flex;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .brandbar{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:22px}
  .brandbar img{display:block}
  .brandbar .hgn{height:26px}
  .brandbar .zb{height:17px}
  .brandbar .x{color:#c9c5d8;font-weight:700;font-size:13px}

  /* intro */
  #intro{justify-content:center;text-align:center}
  .mark{width:96px;height:96px;margin:0 auto 22px;border-radius:30px;
    background:linear-gradient(150deg,var(--purple),var(--purple-d));
    display:grid;place-items:center;font-size:44px;box-shadow:0 16px 30px rgba(255,110,12,.30)}
  #intro h1{font-size:33px;font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
  #intro p{color:var(--muted);font-size:16px;margin-bottom:6px}
  .start{margin-top:28px;width:100%;background:var(--ink);color:#fff;border:none;border-radius:18px;
    padding:18px;font-size:17px;font-weight:800;cursor:pointer;font-family:inherit}
  .start:active{transform:scale(.98)}

  /* game */
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .rnd{font-size:14px;font-weight:800;color:var(--purple)}
  .count{font-size:13px;font-weight:700;color:var(--muted)}
  .bar{height:8px;border-radius:99px;background:#ffe6d2;margin:10px 0 26px;overflow:hidden}
  .bar>div{height:100%;background:linear-gradient(90deg,var(--purple),var(--purple-d));border-radius:99px;transition:width .4s}
  .q{font-size:24px;font-weight:800;text-align:center;margin-bottom:22px;letter-spacing:-.01em}
  .opts{flex:1;display:flex;flex-direction:column;gap:16px;justify-content:center}
  .opt{border:none;border-radius:24px;padding:38px 22px;font-family:inherit;cursor:pointer;
    color:#fff;font-weight:800;transition:.15s;text-align:center;position:relative}
  .opt .big{font-size:26px;display:block;line-height:1.3}
  .opt.a{background:linear-gradient(150deg,#ff8a33,#e25a00)}
  .opt.b{background:linear-gradient(150deg,#2b2a40,#1f1e30)}
  .opt:active{transform:scale(.97)}
  .vs{align-self:center;background:var(--yellow);color:var(--ink);font-weight:900;
    width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:18px;margin:-6px 0}

  /* result */
  #result{text-align:center}
  #result h2{font-size:27px;font-weight:800;margin:8px 0 6px}
  #result .sub{color:var(--muted);font-size:15px;margin-bottom:22px}
  .pick{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;
    padding:14px 16px;margin-bottom:10px;text-align:left;box-shadow:0 6px 18px rgba(31,30,48,.05)}
  .pick .rn{flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:var(--purple);
    color:#fff;font-weight:800;display:grid;place-items:center;font-size:14px}
  .pick .tx{font-weight:700;font-size:16px}
  .pick .tx small{display:block;color:var(--muted);font-weight:600;font-size:12px}
  .cta{display:block;margin-top:20px;background:linear-gradient(150deg,var(--purple),var(--purple-d));
    color:#fff;text-decoration:none;border-radius:18px;padding:17px;font-size:16px;font-weight:800;
    box-shadow:0 12px 26px rgba(255,110,12,.30)}
  .msg{background:#fff0e4;border-radius:16px;padding:16px;font-size:15px;color:#3e3c58;margin-bottom:8px;font-weight:600}
  .retry{margin-top:14px;background:none;border:none;color:var(--muted);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
  .foot{text-align:center;font-size:12px;color:#b3af9f;margin-top:20px}
</style>
</head>
<body>
<div class="app">

  <section id="intro" class="screen on">
    <div class="mark">🏠</div>
    <h1>부동산 밸런스 게임</h1>
    <p>정답은 없어요. 순수 취향 싸움!</p>
    <p>5라운드, 당신의 선택을 골라보세요.</p>
    <button class="start" onclick="start()">게임 시작하기</button>

    <div class="sub">5라운드 취향 결과예요</div>
    <div id="picks"></div>
    <div class="msg" id="msg"></div>
    <!-- 링크: 필요시 교체 -->
    <a class="cta" href="https://www.zigbang.com" target="_blank" rel="noopener" id="cta">분양 정보·시세 보러 가기 →</a>
    <button class="retry" onclick="location.reload()">다시 하기</button>
  </section>

</div>

<script>
const R = [
  {rnd:"ROUND 1", q:"내 집을 고른다면?", a:{t:"역세권 구축", s:"교통 편한 오래된 집"}, b:{t:"숲세권 신축", s:"쾌적한 새 집"}},
  {rnd:"ROUND 2", q:"같은 값이라면?", a:{t:"넓은 구축 30평대", s:"공간이 우선"}, b:{t:"좁아도 신축 20평대", s:"새 집이 우선"}},
  {rnd:"ROUND 3", q:"살 곳을 정한다면?", a:{t:"고층 한강뷰", s:"탁 트인 전망"}, b:{t:"저층 넓은 마당뷰", s:"프라이빗한 공간"}},
  {rnd:"ROUND 4", q:"내 선택은?", a:{t:"전세 살며 청약 존버", s:"기회를 기다린다"}, b:{t:"지금 영끌 매수", s:"일단 내 집부터"}},
  {rnd:"ROUND 5", q:"더 끌리는 집은?", a:{t:"브랜드 대단지", s:"인프라·커뮤니티"}, b:{t:"한적한 나홀로 아파트", s:"조용함·가성비"}},
];

let i=0, picks=[];

function start(){ i=0; picks=[]; show('game'); render(); }
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');window.scrollTo(0,0);}

function render(){
  const r=R[i];
  document.getElementById('rnd').textContent=r.rnd;
  document.getElementById('count').textContent=(i+1)+" / "+R.length;
  document.getElementById('prog').style.width=((i)/R.length*100)+'%';
  document.getElementById('q').textContent=r.q;
  document.getElementById('optA').textContent=r.a.t;
  document.getElementById('optB').textContent=r.b.t;
}

function pick(side){
  const r=R[i];
  picks.push(side===0?r.a:r.b);
  i++;
  if(i<R.length){ render(); }
  else{ showResult(); }
}

function showResult(){
  const wrap=document.getElementById('picks'); wrap.innerHTML='';
  picks.forEach((p,n)=>{
    const el=document.createElement('div'); el.className='pick';
    el.innerHTML='<div class="rn">'+(n+1)+'</div><div class="tx">'+p.t+'<small>'+p.s+'</small></div>';
    wrap.appendChild(el);
  });
  // simple personality read
  const aCount = picks.filter((p,n)=>p===R[n].a).length;
  let msg;
  if(aCount>=4) msg="🏙️ 실속·입지 중시형! 위치와 공간을 먼저 챙기는 타입이에요.";
  else if(aCount<=1) msg="✨ 새것·쾌적함 중시형! 삶의 질과 새 집을 우선하는 타입이에요.";
  else msg="⚖️ 밸런스형! 상황에 따라 유연하게 고르는 실용파예요.";
  document.getElementById('msg').textContent=msg;
  show('result');
}
</script>
</body>
</html>
