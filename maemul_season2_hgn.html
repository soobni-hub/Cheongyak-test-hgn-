<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>이 매물, 사? 말아? 시즌2</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root{--purple:#6b5ae6;--purple-d:#4c3ccb;--ink:#1f1e30;--cream:#faf5ea;
    --coral:#ef4747;--green:#16a367;--yellow:#ffd24a;--muted:#8a879c;--line:#ece8dc;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;
    background:var(--cream);color:var(--ink);line-height:1.5;min-height:100vh;display:flex;justify-content:center}
  .app{width:100%;max-width:460px;min-height:100vh;padding:24px 20px 40px;display:flex;flex-direction:column}
  .brandbar{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:18px;opacity:.9}
  .brandbar img{display:block}.brandbar .hgn{height:24px}.brandbar .zb{height:16px}
  .brandbar .x{color:#c9c5d8;font-weight:700;font-size:12px}
  .screen{display:none;flex:1;flex-direction:column}
  .screen.on{display:flex;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  #intro{justify-content:center;text-align:center}
  .mark{width:92px;height:92px;margin:0 auto 20px;border-radius:28px;
    background:linear-gradient(150deg,var(--purple),var(--purple-d));display:grid;place-items:center;font-size:42px;
    box-shadow:0 16px 30px rgba(107,90,230,.28)}
  #intro .kick{font-size:14px;font-weight:800;color:var(--purple);letter-spacing:.04em;margin-bottom:8px}
  #intro h1{font-size:31px;font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
  #intro p{color:var(--muted);font-size:15px;margin-bottom:5px}
  .start{margin-top:26px;width:100%;background:var(--ink);color:#fff;border:none;border-radius:18px;
    padding:18px;font-size:17px;font-weight:800;cursor:pointer;font-family:inherit}
  .start:active{transform:scale(.98)}
  .foot{text-align:center;font-size:12px;color:#b3af9f;margin-top:20px}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .dots{display:flex;gap:7px}.dot{width:9px;height:9px;border-radius:50%;background:#e1ddcf;transition:.3s}
  .dot.done{background:var(--purple)}.dot.cur{background:var(--purple);transform:scale(1.35)}
  .count{font-size:13px;font-weight:700;color:var(--muted)}
  .qcard{background:#fff;border-radius:26px;padding:28px 22px;box-shadow:0 10px 30px rgba(31,30,48,.06);flex:1;display:flex;flex-direction:column}
  .qnum{display:inline-block;background:var(--yellow);color:var(--ink);font-weight:800;font-size:13px;
    padding:5px 12px;border-radius:999px;align-self:flex-start;margin-bottom:14px}
  .situation{font-size:20px;font-weight:700;letter-spacing:-.01em;margin-bottom:8px}
  .sit-sub{font-size:14px;color:var(--muted)}
  .illus{flex:1;display:flex;align-items:center;justify-content:center;min-height:150px;margin:6px 0}
  .illus svg{width:200px;height:auto;max-height:180px}
  .choices{display:flex;gap:12px;margin-top:8px}
  .choice{flex:1;border:2px solid var(--line);background:#fff;border-radius:20px;padding:20px 10px;
    font-size:19px;font-weight:800;cursor:pointer;transition:.15s;color:var(--ink);font-family:inherit}
  .choice .ic{display:block;font-size:26px;margin-bottom:4px}
  .choice.go:active{transform:scale(.96);border-color:var(--green);background:#eafaf2}
  .choice.stop:active{transform:scale(.96);border-color:var(--coral);background:#fdeeee}
  .reveal{display:none;margin-top:20px;border-radius:20px;padding:20px;animation:fade .35s ease}
  .reveal.correct{background:#eafaf2;border:1.5px solid #bfe9d4}.reveal.wrong{background:#fdeeee;border:1.5px solid #f6cccc}
  .verdict{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;margin-bottom:8px}
  .verdict.correct{color:var(--green)}.verdict.wrong{color:var(--coral)}
  .answer{font-weight:700;font-size:15px;margin-bottom:6px}
  .explain{font-size:15px;color:#4a4860;line-height:1.55}
  .next{margin-top:18px;width:100%;background:var(--ink);color:#fff;border:none;border-radius:16px;
    padding:16px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
  .next:active{transform:scale(.98)}
  #result{justify-content:center;text-align:center}
  .r-emoji{font-size:64px;margin-bottom:10px}
  #result h2{font-size:26px;font-weight:800;margin-bottom:10px}
  .r-score{font-size:15px;font-weight:700;color:var(--purple);background:#efecff;display:inline-block;
    padding:8px 18px;border-radius:999px;margin-bottom:16px}
  #result p{color:#55536a;font-size:16px;margin-bottom:26px;padding:0 6px}
  .cta{display:block;background:linear-gradient(150deg,var(--purple),var(--purple-d));color:#fff;text-decoration:none;
    border-radius:18px;padding:18px;font-size:17px;font-weight:800;box-shadow:0 12px 26px rgba(107,90,230,.28)}
  .cta:active{transform:scale(.98)}
  .retry{margin-top:14px;background:none;border:none;color:var(--muted);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
</style>
</head>

    <div class="qcard">
      <span class="qnum" id="qnum"></span>
      <div class="situation" id="situation"></div>
      <div class="sit-sub" id="sitsub"></div>
      <div class="illus" id="illus"></div>
      <div class="choices" id="choices">
        <button class="choice go" onclick="answer('go')"><span class="ic">👍</span>사요</button>
        <button class="choice stop" onclick="answer('stop')"><span class="ic">✋</span>멈춰요</button>
      </div>
      <div class="reveal" id="reveal">
        <div class="verdict" id="verdict"></div>
        <div class="answer" id="ansline"></div>
        <div class="explain" id="explain"></div>
        <button class="next" id="nextbtn" onclick="next()">다음 →</button>
      </div>
    </div>
  </section>

  <section id="result" class="screen">
    <div class="r-emoji" id="remoji"></div>
    <h2 id="rtitle"></h2>
    <div class="r-score" id="rscore"></div>
    <p id="rdesc"></p>
    <a class="cta" href="https://hogangnono.com" target="_blank" rel="noopener" id="cta">분양 정보·시세 확인은 호갱노노에서 →</a>
    <button class="retry" onclick="location.reload()">다시 해보기</button>
  </section>
</div>

<script>
const SVG_JUTAEK=`<svg viewBox="0 0 260 172" xmlns="http://www.w3.org/2000/svg"><ellipse cx="130" cy="150" rx="80" ry="10" fill="#6b5ae6" opacity=".12"/><path d="M78 84 L130 50 L182 84 Z" fill="#6b5ae6"/><rect x="90" y="84" width="80" height="60" rx="8" fill="#d9d2f9"/><rect x="116" y="112" width="28" height="32" rx="4" fill="#6b5ae6"/><circle cx="70" cy="120" r="16" fill="#ffd24a" stroke="#1f1e30" stroke-width="3"/><rect x="54" y="138" width="32" height="26" rx="10" fill="#ffd24a" stroke="#1f1e30" stroke-width="3"/><circle cx="190" cy="120" r="16" fill="#b7abf2" stroke="#1f1e30" stroke-width="3"/><rect x="174" y="138" width="32" height="26" rx="10" fill="#b7abf2" stroke="#1f1e30" stroke-width="3"/></svg>`;
const SVG_SENGSUK=`<svg viewBox="0 0 260 172" xmlns="http://www.w3.org/2000/svg"><ellipse cx="120" cy="152" rx="76" ry="10" fill="#6b5ae6" opacity=".12"/><rect x="70" y="40" width="100" height="112" rx="9" fill="#d9d2f9"/><rect x="70" y="40" width="100" height="22" rx="9" fill="#6b5ae6"/><rect x="86" y="78" width="24" height="20" rx="3" fill="#fbf9ff"/><rect x="130" y="78" width="24" height="20" rx="3" fill="#fbf9ff"/><rect x="86" y="110" width="24" height="20" rx="3" fill="#fbf9ff"/><rect x="130" y="110" width="24" height="20" rx="3" fill="#fbf9ff"/><circle cx="196" cy="60" r="27" fill="#ef4747"/><rect x="182" y="56" width="28" height="8" rx="4" fill="#fff"/></svg>`;
const SVG_DARK=`<svg viewBox="0 0 260 172" xmlns="http://www.w3.org/2000/svg"><ellipse cx="130" cy="150" rx="76" ry="10" fill="#6b5ae6" opacity=".12"/><path d="M64 84 L130 44 L196 84 Z" fill="#3b2f7a"/><rect x="78" y="84" width="104" height="66" rx="8" fill="#6b5ae6"/><text x="130" y="132" font-size="60" font-weight="900" fill="#ffd24a" text-anchor="middle" font-family="Pretendard,sans-serif">?</text></svg>`;
const SVG_KEY=`<svg viewBox="0 0 260 172" xmlns="http://www.w3.org/2000/svg"><ellipse cx="112" cy="150" rx="72" ry="10" fill="#6b5ae6" opacity=".12"/><path d="M52 84 L112 46 L172 84 Z" fill="#6b5ae6"/><rect x="64" y="84" width="96" height="66" rx="8" fill="#d9d2f9"/><rect x="98" y="112" width="28" height="38" rx="4" fill="#6b5ae6"/><rect x="76" y="96" width="18" height="18" rx="3" fill="#fbf9ff"/><g transform="rotate(30 196 78)"><circle cx="186" cy="70" r="18" fill="none" stroke="#16a367" stroke-width="9"/><rect x="196" y="66" width="40" height="9" fill="#16a367"/><rect x="228" y="66" width="8" height="18" fill="#16a367"/></g></svg>`;

const Q=[
 {num:"상황 1 · 지역주택조합",situation:'"일반 분양보다 훨씬 싼 지역주택조합 아파트!"',
  sub:"알아보니 토지확보율 95%, 조합설립인가·사업승인까지 끝난 막바지 단계래요.",
  correct:"go",illus:SVG_JUTAEK,
  explain:"지역주택조합은 초기 단계일수록 위험하지만, 토지확보율이 높고 인가·승인까지 끝난 막바지면 리스크가 확 줄어요. '사업 단계'를 확인하면 옥석을 가릴 수 있어요."},
 {num:"상황 2 · 생활형 숙박시설",situation:'"여기 살면서 투자도 되는 신축이에요!"',
  sub:"근데 알고 보니 아파트가 아니라 '생활형 숙박시설(생숙)'이래요.",
  correct:"stop",illus:SVG_SENGSUK,
  explain:"생숙은 법적으로 주택이 아니라 원칙적으로 주거용으로 못 써요. 실거주하려면 오피스텔로 용도변경해야 하는데 까다롭고, 안 하면 이행강제금이 나올 수 있어요. '살 수 있다'는 광고와 달라요."},
 {num:"상황 3 · 깜깜이 분양",situation:'"지금 계약하면 특별 할인! 오늘까지예요."',
  sub:"청약홈에도 안 뜨고, 시행사·조건 정보가 거의 없어요.",
  correct:"stop",illus:SVG_DARK,
  explain:"정보가 부족한 분양은 그 자체가 리스크예요. 시행사·시공사, 인허가, 분양 조건을 확인할 수 없으면 신중해야 해요. '급하게 + 정보 없이'는 대표적인 위험 신호예요."},
 {num:"상황 4 · 전매제한 매물",situation:'"실거주할 집인데, 마피로 싸게 나왔어요."',
  sub:"전매제한을 확인했더니, 실거주 목적엔 문제가 없대요.",
  correct:"go",illus:SVG_KEY,
  explain:"전매제한은 '되팔 때' 걸리는 규제예요. 실거주가 목적이고 제한 내용을 확인했다면 문제없어요. 오히려 전매 막힌 매물은 경쟁이 덜해 실수요자에겐 기회가 되기도 해요."},
];
const RES=[
 {min:4,emoji:"🕵️",title:"함정 탐지 완료!",desc:"교묘한 함정도 다 걸러내는 눈이에요. 이제 어떤 매물 앞에서도 흔들리지 않겠어요."},
 {min:2,emoji:"💪",title:"거의 다 왔어요",desc:"감은 좋아요! '왜 싼지, 뭐가 다른지' 한 번 더 따지는 습관만 붙이면 완벽해요."},
 {min:0,emoji:"🚨",title:"조심해야 할 타입",desc:"솔깃한 말에 마음이 급해지는 편이에요. 계약 전, 조건과 정보를 꼭 확인하는 습관을 들여봐요."},
];
let i=0,score=0,locked=false;
function start(){show('quiz');render();}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on');window.scrollTo(0,0);}
function render(){const q=Q[i];locked=false;
 document.getElementById('qnum').textContent=q.num;
 document.getElementById('situation').textContent=q.situation;
 document.getElementById('sitsub').textContent=q.sub;
 document.getElementById('illus').innerHTML=q.illus;
 document.getElementById('count').textContent=(i+1)+" / "+Q.length;
 document.getElementById('dots').innerHTML=Q.map((_,n)=>`<span class="dot ${n<i?'done':n===i?'cur':''}"></span>`).join('');
 document.getElementById('choices').style.display='flex';
 document.getElementById('reveal').style.display='none';
 document.getElementById('reveal').className='reveal';}
function answer(pick){if(locked)return;locked=true;const q=Q[i];const ok=pick===q.correct;if(ok)score++;
 document.getElementById('choices').style.display='none';
 const rv=document.getElementById('reveal');rv.classList.add(ok?'correct':'wrong');rv.style.display='block';
 const v=document.getElementById('verdict');v.className='verdict '+(ok?'correct':'wrong');
 v.innerHTML=(ok?'⭕ 정답이에요!':'❌ 아쉬워요!');
 document.getElementById('ansline').textContent="정답: "+(q.correct==='go'?'사요 👍':'멈춰요 ✋');
 document.getElementById('explain').textContent=q.explain;
 document.getElementById('nextbtn').textContent=(i===Q.length-1)?'결과 보기 →':'다음 →';}
function next(){if(i<Q.length-1){i++;render();}else{showResult();}}
function showResult(){const r=RES.find(r=>score>=r.min);
 document.getElementById('remoji').textContent=r.emoji;
 document.getElementById('rtitle').textContent=r.title;
 document.getElementById('rscore').textContent="4문제 중 "+score+"개 정답";
 document.getElementById('rdesc').textContent=r.desc;show('result');}
</script>
</body>
</html>
